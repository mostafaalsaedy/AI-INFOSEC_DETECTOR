[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Every test module in this suite is async; `auto` mode removes the need to
# decorate each coroutine test individually.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    -ra
    --strict-markers
    --tb=short

markers =
    slow: tests that take more than a second
    ml: tests requiring the optional machine-learning stack

filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:jose.*
