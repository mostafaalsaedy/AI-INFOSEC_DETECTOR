apiVersion: v1
kind: ConfigMap
metadata:
  name: infosec-config
  namespace: infosec-ai-monitor
  labels:
    app.kubernetes.io/name: infosec-ai-monitor
    app.kubernetes.io/component: config
data:
  # Application Configuration
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  ENVIRONMENT: "production"
  
  # Database Configuration
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "infosec_ai_monitor"
  DATABASE_USER: "infosec_monitor"
  
  # Redis Configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  
  # Celery Configuration
  CELERY_BROKER_URL: "redis://redis-service:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/1"
  
  # ML Configuration
  ML_MODELS_ENABLED: "true"
  ML_MODEL_PATH: "/app/models"
  ML_BATCH_SIZE: "32"
  ML_CONFIDENCE_THRESHOLD: "0.8"
  
  # Security Configuration
  ALLOWED_HOSTS: "*"
  ALLOWED_ORIGINS: "https://dashboard.infosecmonitor.ai,https://app.infosecmonitor.ai"
  CORS_ENABLED: "true"
  
  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_PER_MINUTE: "100"
  RATE_LIMIT_PER_HOUR: "5000"
  
  # Monitoring Configuration
  METRICS_ENABLED: "true"
  HEALTH_CHECK_ENABLED: "true"
  
  # Privacy Configuration
  GDPR_COMPLIANCE: "true"
  CCPA_COMPLIANCE: "true"
  DATA_RETENTION_DAYS: "365"
  
  # Notification Configuration
  ALERT_EMAIL_ENABLED: "true"
  ALERT_SLACK_ENABLED: "true"
  ALERT_WEBHOOK_ENABLED: "true"
  
  # WebSocket Configuration
  WEBSOCKET_ENABLED: "true"
  WEBSOCKET_MAX_CONNECTIONS: "1000"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: infosec-ai-monitor
  labels:
    app.kubernetes.io/name: infosec-ai-monitor
    app.kubernetes.io/component: nginx
data:
  nginx.conf: |
    upstream fastapi_backend {
        server api-service:8000;
    }
    
    upstream dashboard_frontend {
        server dashboard-service:3000;
    }
    
    server {
        listen 80;
        server_name infosecmonitor.ai www.infosecmonitor.ai;
        
        # Redirect HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }
    
    server {
        listen 443 ssl http2;
        server_name infosecmonitor.ai www.infosecmonitor.ai;
        
        # SSL Configuration
        ssl_certificate /etc/ssl/certs/tls.crt;
        ssl_certificate_key /etc/ssl/private/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Rate Limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=dashboard:10m rate=30r/s;
        
        # API Routes
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # WebSocket Routes
        location /ws/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Dashboard Routes
        location / {
            limit_req zone=dashboard burst=50 nodelay;
            
            proxy_pass http://dashboard_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Health Check
        location /health {
            proxy_pass http://fastapi_backend/health;
            access_log off;
        }
        
        # Metrics (secured)
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://fastapi_backend/metrics;
        }
    }