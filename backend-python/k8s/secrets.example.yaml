# ---------------------------------------------------------------------------
# Secrets template - DO NOT COMMIT A FILLED-IN COPY OF THIS FILE
#
# This is deliberately NOT part of kustomization.yaml. `kubectl apply -k .`
# will not create these secrets, so a cluster can never come up with the
# placeholder values below.
#
# Preferred: use a secrets manager (External Secrets Operator, Sealed Secrets,
# Vault Agent, or your cloud provider's CSI driver) and never materialise
# plaintext secrets in a file at all.
#
# Otherwise, create them imperatively - values stay out of the repository:
#
#   kubectl -n infosec-ai-monitor create secret generic infosec-secrets \
#     --from-literal=SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
#     --from-literal=EXTENSION_SECRET="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
#     --from-literal=ANONYMIZATION_SALT="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://infosec_monitor:CHANGE_ME@postgres-service:5432/infosec_ai_monitor' \
#     --from-literal=EMAIL_USER='noreply@example.com' \
#     --from-literal=EMAIL_PASSWORD='CHANGE_ME'
#
#   kubectl -n infosec-ai-monitor create secret generic postgres-secret \
#     --from-literal=POSTGRES_USER='infosec_monitor' \
#     --from-literal=POSTGRES_PASSWORD='CHANGE_ME' \
#     --from-literal=POSTGRES_DB='infosec_ai_monitor'
#
#   kubectl -n infosec-ai-monitor create secret tls tls-secret \
#     --cert=fullchain.pem --key=privkey.pem
#
# If you must apply this file, copy it to `secrets.yaml` (already gitignored),
# replace every CHANGE_ME, and apply it directly with `kubectl apply -f`.
#
# `stringData` is used instead of `data` so values are written in plain text
# rather than base64 - base64 is encoding, not encryption, and writing it out
# tends to make people treat placeholder secrets as if they were safe.
# ---------------------------------------------------------------------------

apiVersion: v1
kind: Secret
metadata:
  name: infosec-secrets
  namespace: infosec-ai-monitor
  labels:
    app.kubernetes.io/name: infosec-ai-monitor
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # --- Database -----------------------------------------------------------
  # Must use the asyncpg driver; the app opens async connections.
  DATABASE_URL: "postgresql+asyncpg://infosec_monitor:CHANGE_ME@postgres-service:5432/infosec_ai_monitor"

  # --- Application secrets ------------------------------------------------
  # Three DISTINCT random values, each at least 32 characters. The production
  # settings profile refuses to start if any of them is a dev placeholder.
  SECRET_KEY: "CHANGE_ME_generate_with_secrets_token_urlsafe_48"
  EXTENSION_SECRET: "CHANGE_ME_must_match_the_browser_extension"
  # Rotating this permanently breaks the link to previously pseudonymised
  # records. Treat it as write-once.
  ANONYMIZATION_SALT: "CHANGE_ME_generate_with_secrets_token_urlsafe_48"

  # --- Email --------------------------------------------------------------
  EMAIL_HOST: "smtp.example.com"
  EMAIL_USER: "noreply@example.com"
  EMAIL_PASSWORD: "CHANGE_ME"

  # --- Slack (optional) ---------------------------------------------------
  # The path of a Slack webhook URL is itself the credential.
  SLACK_WEBHOOK_URL: ""

  # --- SIEM webhook (optional) -------------------------------------------
  WEBHOOK_URL: ""
  WEBHOOK_SECRET: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: infosec-ai-monitor
  labels:
    app.kubernetes.io/name: infosec-ai-monitor
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_USER: "infosec_monitor"
  # Must match the password embedded in DATABASE_URL above.
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: "infosec_ai_monitor"

---
# TLS is intentionally not templated here. Writing a private key into a file
# under version control is exactly the mistake this template exists to prevent,
# and a stray PEM block also trips credential scanners.
#
# Use cert-manager, or create the secret from real certificate files:
#
#   kubectl -n infosec-ai-monitor create secret tls tls-secret \
#     --cert=fullchain.pem --key=privkey.pem
#
# The ingress expects the resulting secret to be named `tls-secret`.
