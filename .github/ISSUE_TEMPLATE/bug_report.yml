name: Bug report
description: Something is not working as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please redact any secrets, hostnames or personal
        data before pasting logs.

        **Found a security vulnerability?** Do not file it here — follow
        [SECURITY.md](../blob/main/SECURITY.md) instead.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Browser extension
        - Python backend (backend-python)
        - Laravel backend (backend)
        - Dashboard
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the API with ...
        2. Send a request to ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:               Ubuntu 24.04
        Python / PHP:     3.12.4
        Node:             20.11
        Browser:          Chrome 131
        Deployment:       Docker Compose
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Secrets redacted, please.
      render: shell
