version: 2

updates:
  - package-ecosystem: pip
    directory: /backend-python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem for routine patches keeps the queue readable.
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
